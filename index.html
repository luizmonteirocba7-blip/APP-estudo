<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Painel de Estudos CBMMT · 3º Sargento</title>
<meta name="theme-color" content="#050a0d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-192.png">
<style>
  :root{
    --bg:#050a0d; --frame-a:#0a1419; --frame-b:#0d1b22;
    --line:#1e3a44; --line-soft:#11242c; --teal:#00d4aa; --teal-bright:#00ffcc;
    --txt:#d4e5e8; --txt-bright:#e8f4f6; --muted:#6a8590; --muted-2:#8aa5b0;
    --green:#7dd957; --blue:#5db4ff; --amber:#ffb84d; --red:#ff6b6b;
    --mono:'Courier New',Courier,monospace;
    --sans:'Inter',system-ui,-apple-system,sans-serif;
    --r-md:6px; --r-lg:10px;
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg); margin:0; padding:18px 10px calc(28px + env(safe-area-inset-bottom));
    display:flex; justify-content:center; font-family:var(--mono); color:var(--txt);
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{width:100%; max-width:820px;}

  /* ---------- HUD topo ---------- */
  .hud{
    background:linear-gradient(180deg,var(--frame-a) 0%,var(--frame-b) 100%);
    border:1px solid var(--line); border-radius:var(--r-lg);
    padding:1.25rem; margin-bottom:1.25rem; position:relative;
  }
  .hud::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--teal),transparent);}
  .corner{position:absolute;width:12px;height:12px;border:1px solid var(--teal);}
  .corner.tl{top:4px;left:4px;border-right:none;border-bottom:none;}
  .corner.tr{top:4px;right:4px;border-left:none;border-bottom:none;}
  .corner.bl{bottom:4px;left:4px;border-right:none;border-top:none;}
  .corner.br{bottom:4px;right:4px;border-left:none;border-top:none;}
  .hud-title{font-size:11px;letter-spacing:2px;color:var(--teal);margin:0 0 4px;text-transform:uppercase;}
  .hud-sub{font-size:19px;font-weight:600;margin:0 0 4px;color:var(--txt-bright);font-family:var(--sans);letter-spacing:.5px;}
  .hud-meta{font-size:11px;color:var(--muted);margin:0;letter-spacing:.5px;line-height:1.5;}

  .progress-wrap{margin-top:16px;}
  .bar-bg{width:100%;height:9px;background:var(--frame-a);border:1px solid var(--line);
    border-radius:2px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-bright));
    box-shadow:0 0 8px rgba(0,212,170,.5);transition:width .4s ease;}
  .pills{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .pill{font-size:11px;padding:4px 10px;border-radius:2px;background:var(--frame-a);
    border:1px solid var(--line);color:var(--muted-2);letter-spacing:.5px;}
  .pill.primary{color:var(--teal);border-color:var(--teal);font-weight:600;}
  .pill.green{color:var(--green);border-color:#2d4f1f;}
  .pill.blue{color:var(--blue);border-color:#1e3f5e;}
  .pill.amber{color:var(--amber);border-color:#5e3f1e;}
  .pill.gray{color:var(--muted);border-color:var(--line);}

  /* ---------- backup status ---------- */
  .save-status{display:flex;align-items:center;gap:8px;margin-top:14px;
    font-size:10px;color:var(--muted);letter-spacing:.5px;}
  .save-dot{width:7px;height:7px;border-radius:50%;background:var(--green);
    box-shadow:0 0 6px var(--green);flex-shrink:0;}
  .save-dot.warn{background:var(--amber);box-shadow:0 0 6px var(--amber);}

  /* ---------- divisores ---------- */
  .divider{display:flex;align-items:center;gap:10px;margin:22px 0 10px;
    font-size:10px;letter-spacing:2.5px;color:var(--teal);text-transform:uppercase;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;
    background:linear-gradient(90deg,transparent,var(--line),transparent);}
  .divider .mk{color:var(--amber);}

  /* ---------- cards ---------- */
  .card{background:var(--frame-b);border:1px solid var(--line);border-radius:var(--r-md);
    margin-bottom:10px;overflow:hidden;transition:border-color .2s;}
  .card.open{border-color:var(--teal);}
  .card-head{padding:13px 14px;cursor:pointer;display:flex;align-items:center;
    justify-content:space-between;gap:12px;user-select:none;}
  .card-head:active{background:var(--line-soft);}
  .card-info{flex:1;min-width:0;}
  .card-name{font-size:14px;font-weight:600;margin:0 0 3px;color:var(--txt-bright);
    font-family:var(--sans);letter-spacing:.3px;}
  .card-meta{font-size:10px;color:var(--muted);margin:0;letter-spacing:.5px;}
  .card-prog{display:flex;align-items:center;gap:10px;}
  .mini-bg{width:62px;height:4px;background:var(--frame-a);border:1px solid var(--line);
    border-radius:1px;overflow:hidden;}
  .mini-fill{height:100%;transition:width .4s ease;}
  .mini-num{font-size:11px;color:var(--muted-2);min-width:34px;text-align:right;}
  .chev{color:#4a6670;font-size:14px;transition:transform .2s;width:12px;text-align:center;}
  .card.open .chev{transform:rotate(90deg);color:var(--teal);}

  .topics{display:none;border-top:1px solid var(--line);padding:4px 0;background:var(--frame-a);}
  .card.open .topics{display:block;}
  .topic{padding:9px 14px;display:flex;align-items:center;gap:10px;font-size:12px;
    border-left:2px solid transparent;}
  .topic:active{background:var(--line-soft);}
  .topic-num{font-size:10px;color:#4a6670;min-width:30px;font-family:var(--mono);}
  .topic-txt{flex:1;color:#c5d6da;line-height:1.5;font-family:var(--sans);}
  .topic-btns{display:flex;gap:4px;}
  .sbtn{width:30px;height:30px;border-radius:5px;border:1px solid var(--line);
    background:var(--frame-b);cursor:pointer;display:flex;align-items:center;
    justify-content:center;font-size:13px;color:#4a6670;padding:0;transition:all .15s;}
  .sbtn:active{transform:scale(.9);}
  .sbtn.active.nao{background:#1a2a32;border-color:#4a6670;color:var(--muted-2);}
  .sbtn.active.estudando{background:#3d2a0a;border-color:var(--amber);color:var(--amber);}
  .sbtn.active.revisar{background:#0a2540;border-color:var(--blue);color:var(--blue);}
  .sbtn.active.dominado{background:#0a3320;border-color:var(--green);color:var(--green);
    box-shadow:0 0 6px rgba(125,217,87,.3);}

  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10px;color:var(--muted);
    margin:12px 0;padding:9px 12px;background:var(--frame-a);border:1px solid var(--line);
    border-radius:2px;letter-spacing:.5px;text-transform:uppercase;}
  .legend-item{display:flex;align-items:center;gap:6px;}
  .legend-dot{width:10px;height:10px;border-radius:2px;border:1px solid;}

  .group-tag{display:inline-block;background:#0a2540;color:var(--blue);font-size:9px;
    padding:2px 6px;border-radius:2px;border:1px solid #1e3f5e;margin-right:6px;
    letter-spacing:1px;text-transform:uppercase;vertical-align:1px;}

  /* ---------- botões de ação ---------- */
  .actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;padding:12px;
    background:var(--frame-b);border:1px solid var(--line);border-radius:var(--r-md);}
  .btn{font-size:11px;padding:11px 15px;border-radius:5px;background:transparent;
    border:1px solid var(--line);cursor:pointer;color:var(--muted-2);font-family:var(--mono);
    letter-spacing:1px;text-transform:uppercase;transition:all .15s;flex:1;min-width:130px;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:#0a1f1a;color:var(--teal);border-color:var(--teal);}
  .btn.danger{color:var(--red);border-color:#4a2a2a;}

  .backup-row{display:flex;gap:8px;margin-top:10px;}
  .backup-row .btn{flex:1;}

  .loading{padding:2rem;text-align:center;color:var(--teal);font-size:12px;
    letter-spacing:2px;text-transform:uppercase;}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(5,10,13,.85);backdrop-filter:blur(4px);
    display:none;justify-content:center;align-items:center;z-index:1000;padding:16px;}
  .modal{background:var(--frame-b);border:1px solid var(--teal);border-radius:var(--r-md);
    padding:24px;max-width:420px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.5);font-family:var(--sans);}
  .modal-txt{color:var(--txt-bright);font-size:14px;line-height:1.6;margin-bottom:20px;
    white-space:pre-wrap;word-break:break-word;}
  .modal-acts{display:flex;justify-content:flex-end;gap:10px;}
</style>
</head>

const STATUS = {
  nao:{icon:"○", label:"Não estudado", pts:0},
  estudando:{icon:"◐", label:"Estudando", pts:0.4},
  revisar:{icon:"↻", label:"Revisar", pts:0.75},
  dominado:{icon:"✓", label:"Dominado", pts:1}
};
const STATUS_ORDER = ["nao","estudando","revisar","dominado"];

const STORAGE_KEY = "cbmmt:progresso:v4";
let state = {};

/* ---------- persistência robusta ---------- */
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    state = raw ? JSON.parse(raw) : {};
  }catch(e){ state = {}; }
  render();
}
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    localStorage.setItem(STORAGE_KEY + ":ts", Date.now().toString());
  }catch(e){ console.error("Erro ao salvar:", e); }
}
function lastSaved(){
  const ts = parseInt(localStorage.getItem(STORAGE_KEY + ":ts") || "0", 10);
  if(!ts) return null;
  return new Date(ts);
}

/* ---------- status helpers ---------- */
function getStatus(k,i){ return state[k]?.[i] || "nao"; }
function setStatus(k,i,s){
  if(!state[k]) state[k] = {};
  if(s === "nao") delete state[k][i];
  else state[k][i] = s;
  saveState(); render();
}
function cycleStatus(k,i,evt){
  evt.stopPropagation();
  const cur = getStatus(k,i);
  const next = STATUS_ORDER[(STATUS_ORDER.indexOf(cur)+1) % STATUS_ORDER.length];
  setStatus(k,i,next);
}
function pickStatus(k,i,s,evt){
  evt.stopPropagation();
  setStatus(k,i, getStatus(k,i)===s ? "nao" : s);
}

/* ---------- cálculos ---------- */
function subjectPct(k){
  const t = EDITAL[k].topics.length; let p = 0;
  for(let i=0;i<t;i++) p += STATUS[getStatus(k,i)].pts;
  return Math.round((p/t)*100);
}
function aggregate(keys){
  let pts=0, tot=0;
  keys.forEach(k=>{
    EDITAL[k].topics.forEach((_,i)=>{ pts += STATUS[getStatus(k,i)].pts; tot++; });
  });
  return tot ? Math.round((pts/tot)*100) : 0;
}
function counts(){
  const c={nao:0,estudando:0,revisar:0,dominado:0};
  for(const k in EDITAL) EDITAL[k].topics.forEach((_,i)=> c[getStatus(k,i)]++);
  return c;
}
function progColor(p){
  if(p>=80) return "linear-gradient(90deg,var(--teal),var(--teal-bright))";
  if(p>=50) return "linear-gradient(90deg,var(--green),#a8e87a)";
  if(p>=25) return "linear-gradient(90deg,var(--amber),#ffd17a)";
  return "#4a6670";
}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* ---------- render ---------- */
function cardHTML(key){
  const s = EDITAL[key], pct = subjectPct(key);
  const dom = s.topics.filter((_,i)=>getStatus(key,i)==="dominado").length;
  const tag = s.group==="CP" ? `<span class="group-tag">CP·2.0</span>` : "";
  return `
  <div class="card" data-k="${key}">
    <div class="card-head" onclick="toggleCard('${key}')">
      <div class="card-info">
        <p class="card-name">${tag}${esc(s.name)}</p>
        <p class="card-meta">${esc(s.meta)} · ${dom}/${s.topics.length} dominados</p>
      </div>
      <div class="card-prog">
        <div class="mini-bg"><div class="mini-fill" style="width:${pct}%;background:${progColor(pct)};"></div></div>
        <span class="mini-num">${pct}%</span>
        <span class="chev">▶</span>
      </div>
    </div>
    <div class="topics">
      ${s.topics.map((t,i)=>{
        const cur = getStatus(key,i);
        return `<div class="topic">
          <span class="topic-num">${String(i+1).padStart(2,"0")}</span>
          <span class="topic-txt">${esc(t)}</span>
          <span class="topic-btns">
            ${STATUS_ORDER.map(st=>`<button class="sbtn ${st} ${cur===st?'active':''}"
              onclick="pickStatus('${key}',${i},'${st}',event)" title="${STATUS[st].label}">${STATUS[st].icon}</button>`).join('')}
          </span>
        </div>`;
      }).join('')}
      <div style="padding:8px 14px;">
        <button class="btn primary" style="flex:none;width:100%;" onclick="studyArea('${key}')">▶ Estudar essa área agora</button>
      </div>
    </div>
  </div>`;
}

function render(){
  const overall = aggregate(Object.keys(EDITAL));
  const c = counts();
  const cpKeys = Object.keys(EDITAL).filter(k=>EDITAL[k].group==="CP");
  const cpPct = aggregate(cpKeys);

  const ls = lastSaved();
  const savedTxt = ls
    ? `progresso salvo neste aparelho · ${ls.toLocaleDateString('pt-BR')} ${ls.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`
    : `nenhum progresso salvo ainda`;

  let html = `
  <div class="hud">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <p class="hud-title">// SYS.CBMMT · 3º SGT</p>
    <p class="hud-sub">Painel de estudos</p>
    <p class="hud-meta">EDITAL 003/DEIP/BM-1/CBMMT/2021 · 80 questões · 4 grupos · mín. 50% por grupo</p>
    <div class="progress-wrap">
      <div class="bar-bg"><div class="bar-fill" style="width:${overall}%;"></div></div>
      <div class="pills">
        <span class="pill primary">${overall}% GERAL</span>
        <span class="pill green">${c.dominado} OK</span>
        <span class="pill blue">${c.revisar} REV</span>
        <span class="pill amber">${c.estudando} EM CURSO</span>
        <span class="pill gray">${c.nao} PEND</span>
      </div>
      <div class="save-status">
        <span class="save-dot ${ls?'':'warn'}"></span>${savedTxt}
      </div>
    </div>
  </div>

  <div class="legend">
    <span class="legend-item"><span class="legend-dot" style="background:#1a2a32;border-color:#4a6670;"></span>Não estudado</span>
    <span class="legend-item"><span class="legend-dot" style="background:#3d2a0a;border-color:var(--amber);"></span>Estudando</span>
    <span class="legend-item"><span class="legend-dot" style="background:#0a2540;border-color:var(--blue);"></span>Revisar</span>
    <span class="legend-item"><span class="legend-dot" style="background:#0a3320;border-color:var(--green);"></span>Dominado</span>
  </div>

  <div class="divider"><span class="mk">[01]</span> Conhecimentos Profissionais · ${cpPct}% · peso 2.0</div>`;

  cpKeys.forEach(k=> html += cardHTML(k));

  html += `<div class="divider"><span class="mk">[02]</span> Português + Adm. Pública · peso 1.0</div>` + cardHTML("clpap");
  html += `<div class="divider"><span class="mk">[03]</span> Polícia Judiciária Militar · peso 1.25</div>` + cardHTML("cpjm");
  html += `<div class="divider"><span class="mk">[04]</span> Legislação Bombeiro Militar · peso 1.75</div>` + cardHTML("clibm");

  html += `
  <div class="actions">
    <button class="btn primary" onclick="suggestNext()">▶ O que estudar agora?</button>
    <button class="btn" onclick="reviewMode()">↻ Modo revisão</button>
  </div>
  <div class="backup-row">
    <button class="btn" onclick="exportBackup()">⭳ Salvar backup</button>
    <button class="btn" onclick="importBackup()">⭱ Restaurar backup</button>
    <button class="btn danger" onclick="resetAll()">⨯ Zerar</button>
  </div>`;

  const el = document.getElementById("content");
  el.className = "";
  el.innerHTML = html;
}

/* ---------- interações ---------- */
window.toggleCard = k => document.querySelector(`.card[data-k="${k}"]`).classList.toggle("open");
window.pickStatus = pickStatus;

window.sendPrompt = function(text){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text)
      .then(()=> openModal("COPIADO!\n\nCole este comando no seu Claude, ChatGPT ou Gemini para começar:\n\n"+text))
      .catch(()=> fallbackCopy(text));
  } else fallbackCopy(text);
};
function fallbackCopy(text){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.left="-9999px";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); openModal("COPIADO!\n\nCole no seu assistente de IA:\n\n"+text); }
  catch(e){ openModal("Copie o texto abaixo manualmente:\n\n"+text); }
  document.body.removeChild(ta);
}

window.studyArea = function(key){
  const s = EDITAL[key];
  let alvo = s.topics.find((_,i)=>getStatus(key,i)==="nao") || s.topics[0];
  sendPrompt(`Quero estudar agora a área "${s.name}" para o concurso de 3º Sargento do CBMMT. Comece pelo tópico: "${alvo}". Me ensine com base nos materiais oficiais do edital (manuais do CBMMT/CBMGO/PMESP/PHTLS conforme a área). No final, faça 3 perguntas objetivas de múltipla escolha (estilo prova) para eu testar se aprendi.`);
};
window.suggestNext = function(){
  sendPrompt("Aja como meu mentor de estudos para o concurso de 3º Sargento do CBMMT (Edital 003/2021). Os grupos têm pesos diferentes: Conhecimentos Profissionais peso 2,0; Legislação BM peso 1,75; Polícia Judiciária Militar peso 1,25; Português+Adm. Pública peso 1,0. Considerando que preciso de no mínimo 50% em cada grupo, o que devo estudar agora para maximizar minha pontuação? Escolha um tópico e me ensine.");
};
window.reviewMode = function(){
  sendPrompt("Quero entrar em modo revisão para o concurso de 3º Sargento do CBMMT. Faça uma bateria de 10 questões objetivas de múltipla escolha (5 alternativas cada) misturando Conhecimentos Profissionais de bombeiro, APH e Legislação do CBMMT. Espere eu responder e depois corrija explicando cada uma.");
};

/* ---------- backup / restauração ---------- */
window.exportBackup = function(){
  try{
    const payload = { app:"cbmmt-painel", versao:"v4", data:Date.now(), progresso:state };
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url; a.download = `backup-estudos-cbmmt-${stamp}.json`;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
    openModal("Backup gerado!\n\nGuarde esse arquivo no Google Drive, e-mail ou no seu celular. Se um dia o app perder os dados, use \"Restaurar backup\" para recuperar tudo.");
  }catch(e){ openModal("Não foi possível gerar o backup neste aparelho."); }
};
window.importBackup = function(){ document.getElementById("fileInput").click(); };
document.getElementById("fileInput").addEventListener("change", function(evt){
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const obj = JSON.parse(e.target.result);
      const prog = obj.progresso || obj;
      if(typeof prog !== "object") throw new Error("formato");
      openModal("Restaurar este backup vai SUBSTITUIR o progresso atual deste aparelho.\n\nDeseja continuar?", true, ()=>{
        state = prog; saveState(); render();
        openModal("Progresso restaurado com sucesso!");
      });
    }catch(err){ openModal("Arquivo inválido. Selecione um backup gerado por este painel."); }
  };
  reader.readAsText(file);
  evt.target.value = "";
});

window.resetAll = function(){
  openModal("Atenção!\n\nVocê vai ZERAR todo o seu progresso de estudos neste aparelho. Isso não pode ser desfeito.\n\nDica: gere um backup antes, por segurança.\n\nTem certeza?", true, ()=>{
    state = {}; saveState(); render();
  });
};

/* ---------- modal ---------- */
function openModal(msg, confirm=false, onOk=null){
  const m=document.getElementById("modal"), txt=document.getElementById("modalMsg");
  const ok=document.getElementById("modalOk"), cancel=document.getElementById("modalCancel");
  txt.textContent = msg;
  cancel.style.display = confirm ? "block" : "none";
  m.style.display = "flex";
  ok.onclick = ()=>{ m.style.display="none"; if(onOk) onOk(); };
  cancel.onclick = ()=> m.style.display="none";
}

/* ---------- start ---------- */
loadState();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
